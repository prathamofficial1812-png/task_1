version: "3.8"
services:
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:3000"
    networks:
      - network-backend
  api:
    build: ./backend
    depends_on:
      - mongo
    env_file:
    - .env
    ports:
      - "8081:3001"
    networks: 
     - network-backend
  
  mongo:
    image: mongo
    restart: always
    volumes: 
      - mongodb_data:/data/db
    environment: 
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    # uncomment following lines to access db locally
    # ports:
    #   - 27017:27017
    networks: 
     - network-backend

networks:
  network-backend:

volumes: 
  mongodb_data:
